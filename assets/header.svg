<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/><stop offset="1" stop-color="#0D1B2A"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FF9C"/><stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00FF9C" stop-opacity="0.35"/><stop offset="1" stop-color="#00FF9C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FF9C" stop-opacity="0"/><stop offset="1" stop-color="#00FF9C" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1B2B3F" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .type { animation: type 2.6s steps(45, end) 0.6s both; }
    .blink { animation: blink 1s steps(1) infinite; }
    .scan { animation: scan 5s linear infinite; }
    .spin { transform-origin: 0 0; animation: spin 4s linear infinite; }
    .ping { animation: ping 4s ease-in-out infinite; }
    @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(320px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ping { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity="0.6"/>
    <!-- scanline -->
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#00FF9C" opacity="0.25"/>
    <!-- radar -->
    <g transform="translate(985 160)">
      <circle r="150" fill="url(#glow)"/>
      <circle r="120" fill="none" stroke="#00FF9C" stroke-opacity="0.35"/>
      <circle r="80" fill="none" stroke="#00FF9C" stroke-opacity="0.25"/>
      <circle r="40" fill="none" stroke="#00FF9C" stroke-opacity="0.2"/>
      <path d="M-120 0H120M0 -120V120" stroke="#00FF9C" stroke-opacity="0.15"/>
      <g class="spin"><path d="M0 0L120 0A120 120 0 0 0 85 -85Z" fill="url(#sweep)"/></g>
      <circle class="ping" style="animation-delay:0.5s" cx="55" cy="-48" r="4" fill="#FF4D6D"/>
      <circle class="ping" style="animation-delay:2.1s" cx="-70" cy="30" r="3.5" fill="#FFB86B"/>
      <circle class="ping" style="animation-delay:3s" cx="20" cy="85" r="3" fill="#00D4FF"/>
      <!-- shield -->
      <path d="M0 -34L28 -22V2C28 20 15 32 0 38C-15 32 -28 20 -28 2V-22Z" fill="#0A0F1A" stroke="#00FF9C" stroke-width="2.5"/>
      <path d="M-11 2L-3 10L13 -8" fill="none" stroke="#00FF9C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- text -->
    <text x="70" y="78" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16" fill="#00D4FF" letter-spacing="3">// HELLO WORLD, I'M</text>
    <text x="66" y="150" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="url(#txt)" letter-spacing="1">Nikhil Dahiya</text>
    <text x="70" y="186" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="21" fill="#C9D1D9">Cybersecurity · SOC &amp; Detection Engineering · Cloud Security</text>
    <g class="type">
      <text x="70" y="228" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="18" fill="#00FF9C">&gt; M.Sc. Cybersecurity student based in Berlin_</text>
    </g>
    <rect class="blink" x="70" y="248" width="10" height="3" fill="#00FF9C"/>
    <g font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#7D8590">
      <text x="70" y="290">[ SIEM ]   [ KQL ]   [ MITRE ATT&amp;CK ]   [ Python ]   [ Azure · GCP ]</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#1F3A4F"/>
</svg>